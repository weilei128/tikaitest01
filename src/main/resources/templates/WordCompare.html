<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
    <head>
        <title></title>
        <style>
            html, body
            {
                height: 100%;
            }
            .main
            {
                height: 100%;
            }
        </style>
        <script language="javascript" type="text/javascript">
            function AfterDocumentOpened() {
                document.getElementById("PageOfficeCtrl1").SetEnableFileCommand(3, false); // 禁止保存
                document.getElementById("PageOfficeCtrl1").SetEnableFileCommand(4, false); // 禁止另存
                document.getElementById("PageOfficeCtrl1").SetEnableFileCommand(5, false); //禁止打印
                document.getElementById("PageOfficeCtrl1").SetEnableFileCommand(6, false); // 禁止页面设置
            }
            function SaveDocument() {
                document.getElementById("PageOfficeCtrl1").WebSave();
            }
            function ShowFile1View() {
                document.getElementById("PageOfficeCtrl1").Document.ActiveWindow.View.ShowRevisionsAndComments = false;
                document.getElementById("PageOfficeCtrl1").Document.ActiveWindow.View.RevisionsView = 1;
            }
            function ShowFile2View() {
                document.getElementById("PageOfficeCtrl1").Document.ActiveWindow.View.ShowRevisionsAndComments = false;
                document.getElementById("PageOfficeCtrl1").Document.ActiveWindow.View.RevisionsView = 0;
            }
            function ShowCompareView() {
                document.getElementById("PageOfficeCtrl1").Document.ActiveWindow.View.ShowRevisionsAndComments = true;
                document.getElementById("PageOfficeCtrl1").Document.ActiveWindow.View.RevisionsView = 0;
            }
            function SetFullScreen() {
                document.getElementById("PageOfficeCtrl1").FullScreen = !document.getElementById("PageOfficeCtrl1").FullScreen;
            }
        </script>
        
    </head>
    <body>
        <div style="width:auto;height:100%;" th:utext="${pageoffice}"></div>
    </body>
</html>
