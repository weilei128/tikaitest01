version : '3.8'
services:
  oo-nacos:
    container_name: oo-nacos
    image: nacos/nacos-server
    build:
      context: ./nacos
    environment:
      - MODE=standalone
    volumes:
      - ./nacos/logs/:/home/nacos/logs
      - ./nacos/conf/application.properties:/home/nacos/conf/application.properties
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      - oo-mysql
  oo-mysql:
    container_name: oo-mysql
    image: mysql:5.7
    build:
      context: ./mysql
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/conf:/etc/mysql/conf.d
      - ./mysql/logs:/logs
      - ./mysql/data:/var/lib/mysql
    command: [
          'mysqld',
          '--innodb-buffer-pool-size=80M',
          '--character-set-server=utf8mb4',
          '--collation-server=utf8mb4_unicode_ci',
          '--default-time-zone=+8:00',
          '--lower-case-table-names=1'
        ]
    environment:
      MYSQL_DATABASE: 'ry-cloud'
      MYSQL_ROOT_PASSWORD: password
  oo-redis:
    container_name: oo-redis
    image: redis
    build:
      context: ./redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/conf/redis.conf:/home/oo/redis/redis.conf
      - ./redis/data:/data
    command: redis-server /home/oo/redis/redis.conf
  oo-nginx:
    container_name: oo-nginx
    image: nginx
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/html/dist:/home/oo/projects/oo-ui
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/logs:/var/log/nginx
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - oo-gateway
    links:
      - oo-gateway
  oo-gateway:
    container_name: oo-gateway
    build:
      context: ./oo/gateway
      dockerfile: dockerfile
    ports:
      - "5758:5758"
    depends_on:
      - oo-redis
    links:
      - oo-redis
  oo-auth:
    container_name: oo-auth
    build:
      context: ./oo/auth
      dockerfile: dockerfile
    ports:
      - "9200:9200"
    depends_on:
      - oo-redis
    links:
      - oo-redis
  oo-modules-system:
    container_name: oo-modules-system
    build:
      context: ./oo/modules/system
      dockerfile: dockerfile
    ports:
      - "9201:9201"
    depends_on:
      - oo-redis
      - oo-mysql
    links:
      - oo-redis
      - oo-mysql
  oo-modules-gen:
    container_name: oo-modules-gen
    build:
      context: ./oo/modules/gen
      dockerfile: dockerfile
    ports:
      - "9202:9202"
    depends_on:
      - oo-mysql
    links:
      - oo-mysql
  oo-modules-job:
    container_name: oo-modules-job
    build:
      context: ./oo/modules/job
      dockerfile: dockerfile
    ports:
      - "9203:9203"
    depends_on:
      - oo-mysql
    links:
      - oo-mysql
  oo-modules-file:
    container_name: oo-modules-file
    build:
      context: ./oo/modules/file
      dockerfile: dockerfile
    ports:
      - "9300:9300"
    volumes:
    - ./oo/uploadPath:/home/oo/uploadPath
  oo-visual-monitor:
    container_name: oo-visual-monitor
    build:
      context: ./oo/visual/monitor
      dockerfile: dockerfile
    ports:
      - "9100:9100"
